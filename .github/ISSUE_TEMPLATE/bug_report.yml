name: Bug Report
description: Report a problem with the TaoPulse app
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the
        sections below so we can reproduce and fix it quickly.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can a maintainer reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Add screenshots, recordings, or relevant log output if available.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device, OS version, app version, and `flutter doctor` output if relevant.
      placeholder: |
        - Device: Pixel 7
        - OS: Android 14
        - App version: 1.0.0
    validations:
      required: false
